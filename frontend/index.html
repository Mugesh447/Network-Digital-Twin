<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Digital Twin - Virtual Infrastructure Simulator & Telemetry Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            500: '#0066ff',
                            600: '#0052cc',
                            900: '#001a4d',
                        },
                        cyber: {
                            dark: '#0a0e17',
                            card: '#121824',
                            border: '#1e293b',
                            accent: '#00f2fe',
                            pink: '#4facfe'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .code-font {
            font-family: 'Fira Code', monospace;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Glowing Pulse Animations */
        @keyframes pulse-cyan {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.7)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 242, 254, 1)); }
        }

        @keyframes pulse-red {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.7)); }
            50% { filter: drop-shadow(0 0 18px rgba(239, 68, 68, 1)); }
        }

        .glow-active { animation: pulse-cyan 2.5s infinite; }
        .glow-failed { animation: pulse-red 1.2s infinite; }

        .login-grid {
            background-color: #080c14;
            background-image: linear-gradient(rgba(56, 189, 248, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(56, 189, 248, 0.045) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .login-card {
            background: #101820;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        }

        .login-brand-mark {
            box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.24), 0 0 28px rgba(8, 145, 178, 0.18);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e17;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Main React Application Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Mock topology generator (used when backend /api/topology is unavailable)
        function generateMockTopology() {
            const nodes = [];
            const professionalNames = [
                'Core Gateway',
                'Distribution Gateway',
                'Campus Aggregation',
                'WAN Edge Router',
                'Security Gateway',
                'Internet Edge'
            ];
            for (let i = 1; i <= 6; i++) {
                nodes.push({
                    id: `n${i}`,
                    name: professionalNames[i - 1],
                    type: i % 3 === 0 ? 'switch' : 'router',
                    ip: `10.0.0.${i}`,
                    x: 100 + (i * 120) % 900,
                    y: 100 + ((i * 80) % 400),
                    status: 'active',
                    cpu_load: Math.round(20 + Math.random() * 60),
                    ram_load: Math.round(15 + Math.random() * 70),
                    routing_table: []
                });
            }

            const links = [];
            for (let i = 0; i < nodes.length - 1; i++) {
                links.push({ id: `l${i + 1}`, source: nodes[i].id, target: nodes[i + 1].id, latency: Math.round(1 + Math.random() * 40), utilization: Math.round(Math.random() * 80), status: 'up', loss: 0, throughput: Math.round(100 + Math.random() * 900) });
            }

            return {
                nodes,
                links,
                incidents: [],
                summary: {
                    total_nodes: nodes.length,
                    total_links: links.length,
                    active_nodes: nodes.length,
                    failed_nodes: 0,
                    health_score: 95,
                    drift_percentage: 0,
                    avg_latency: Math.round(links.reduce((s,l)=>s+l.latency,0)/links.length),
                    total_throughput_gbps: (links.reduce((s,l)=>s+l.throughput,0)/1000).toFixed(2)
                }
            };
        }

        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('admin');
            const [password, setPassword] = useState('admin123');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async event => {
                event.preventDefault();
                setLoading(true);
                setError('');
                try {
                    const result = await onLogin(username, password);
                    if (!result.success) setError(result.error || 'Unable to sign in.');
                } catch (requestError) {
                    setError('Backend unavailable. Start the server and try again.');
                } finally {
                    setLoading(false);
                }
            };

            const createAccount = async () => {
                const newUsername = window.prompt('Choose a username (3+ characters):');
                if (!newUsername) return;
                const newPassword = window.prompt('Choose a password (6+ characters):');
                if (!newPassword) return;
                const role = window.prompt('Role: viewer or operator', 'viewer') || 'viewer';
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: newUsername, password: newPassword, role })
                });
                const result = await response.json();
                if (!result.success) {
                    setError(result.error || 'Unable to create account.');
                    return;
                }
                await onLogin(newUsername, newPassword);
            };

            return (
                <>
                <button onClick={createAccount} className="fixed top-6 right-6 z-20 px-4 py-2 rounded-lg border border-slate-700 bg-[#111b24] text-xs text-slate-300 hover:text-cyan-300 hover:border-cyan-400/60 transition">Create account <i className="fa-solid fa-user-plus ml-2"></i></button>
                <div className="login-grid min-h-screen text-slate-100 flex items-center justify-center p-6 relative overflow-hidden">
                    <div className="relative w-full max-w-5xl min-h-[560px] grid lg:grid-cols-[1.05fr_0.95fr] login-card rounded-2xl overflow-hidden">
                        <div className="hidden lg:flex flex-col justify-between p-12 bg-[#0d151d] border-r border-slate-700/60">
                            <div><div className="flex items-center gap-3 mb-16"><div className="login-brand-mark w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-400/40 flex items-center justify-center"><i className="fa-solid fa-network-wired text-xl text-cyan-300"></i></div><div><div className="font-bold tracking-[0.18em] text-sm">NDT / CONTROL PLANE</div><div className="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Network operations workspace</div></div></div><div className="text-[10px] uppercase tracking-[0.28em] text-cyan-300 mb-4">Digital twin workspace</div><h1 className="text-4xl font-semibold leading-tight text-slate-100">Network visibility<br /><span className="text-cyan-300">with operational context.</span></h1><p className="mt-6 max-w-md text-sm leading-6 text-slate-400">Topology, telemetry, route analysis, and failure simulation in one controlled workspace.</p></div>
                            <div className="grid grid-cols-3 gap-3 text-[10px] text-slate-400"><div className="p-3 rounded-xl bg-white/5 border border-white/10"><i className="fa-solid fa-wave-square text-cyan-300 mb-2"></i><div>Live telemetry</div></div><div className="p-3 rounded-xl bg-white/5 border border-white/10"><i className="fa-solid fa-route text-cyan-300 mb-2"></i><div>Route analysis</div></div><div className="p-3 rounded-xl bg-white/5 border border-white/10"><i className="fa-solid fa-shield-halved text-cyan-300 mb-2"></i><div>Failure testing</div></div></div>
                        </div>
                        <div className="flex items-center justify-center p-8 sm:p-12 bg-[#111b24]"><form onSubmit={submit} className="w-full max-w-sm space-y-6"><div className="lg:hidden flex items-center gap-3 mb-10"><div className="login-brand-mark w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-400/40 flex items-center justify-center"><i className="fa-solid fa-network-wired text-cyan-300"></i></div><div className="font-bold tracking-widest text-sm">NDT / CONTROL PLANE</div></div><div><div className="flex items-center justify-between mb-3"><div className="text-[10px] uppercase tracking-[0.25em] text-cyan-300">Operator sign-in</div><span className="text-[10px] text-emerald-400"><i className="fa-solid fa-circle text-[6px] mr-1"></i>System ready</span></div><h2 className="text-3xl font-semibold text-slate-100">Access workspace</h2><p className="text-sm text-slate-400 mt-2">Authenticate to open the network control room.</p></div><label className="block"><span className="text-xs text-slate-400">Role profile</span><select value={username} onChange={event => { setUsername(event.target.value); setPassword(`${event.target.value}123`); }} className="mt-2 w-full bg-[#0c141b] border border-slate-700/80 rounded-lg px-4 py-3 text-sm outline-none focus:border-cyan-400"><option value="admin">Administrator</option><option value="operator">Network Operator</option><option value="viewer">Read-only Viewer</option></select></label><label className="block"><span className="text-xs text-slate-400">Password</span><input value={password} onChange={event => setPassword(event.target.value)} type="password" className="mt-2 w-full bg-[#0c141b] border border-slate-700/80 rounded-lg px-4 py-3 text-sm outline-none focus:border-cyan-400" /></label>{error && <div className="p-3 rounded-lg border border-red-500/30 bg-red-500/10 text-xs text-red-300"><i className="fa-solid fa-circle-exclamation mr-2"></i>{error}</div>}<button disabled={loading} className="w-full py-3 rounded-lg bg-cyan-400 hover:bg-cyan-300 disabled:opacity-60 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 transition">{loading ? 'Authenticating...' : 'Open control room'}<i className="fa-solid fa-arrow-right ml-3"></i></button><div className="flex items-center justify-between text-[10px] text-slate-500"><span><i className="fa-solid fa-lock mr-1"></i>Encrypted session</span><span>Build 2.4.0</span></div></form></div>
                    </div>
                </div>
                </>
            );
        }

        function App() {
            const [topology, setTopology] = useState({ nodes: [], links: [], summary: {}, incidents: [] });
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedLink, setSelectedLink] = useState(null);
            const [activeTab, setActiveTab] = useState('inspector'); // inspector, cli, simulator, telemetry, twin, ai, config
            const [template, setTemplate] = useState('enterprise_campus');
            const [twinMode, setTwinMode] = useState('LIVE_SYNC');
            const [aiDiagnostics, setAiDiagnostics] = useState(null);
            const [copilotInsights, setCopilotInsights] = useState(null);
            const [networkInsights, setNetworkInsights] = useState(null);
            const [advancedData, setAdvancedData] = useState(null);
            const [auth, setAuth] = useState({ authenticated: false, role: 'viewer', token: '' });
            const [liveStatus, setLiveStatus] = useState('connecting');
            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            const [isConfigModalOpen, setIsConfigModalOpen] = useState(false);
            const [generatedConfig, setGeneratedConfig] = useState('');
            const [pathFinder, setPathFinder] = useState({ source: '', target: '', result: null });
            const [cliHistory, setCliHistory] = useState([
                { text: "Cisco IOS Software, Digital Twin Emulator v15.4", type: "system" },
                { text: "Type 'help' or 'show ip route' to begin.", type: "system" }
            ]);
            const [cliInput, setCliInput] = useState('');

            // Metrics history for charts
            const [metricsHistory, setMetricsHistory] = useState({ cpu: [], ram: [], ts: [] });

            // Fetch topology periodically (fallback to mock data)
            const fetchTopology = async () => {
                let data = null;
                try {
                    const res = await fetch('/api/topology');
                    if (!res.ok) throw new Error('non-OK');
                    data = await res.json();
                } catch (err) {
                    console.warn('Using mock topology data (backend unavailable)');
                    data = generateMockTopology();
                }

                setTopology(data);
                if (selectedNode) {
                    const updated = data.nodes.find(n => n.id === selectedNode.id);
                    if (updated) setSelectedNode(updated);
                }

                // Update metrics history (average across nodes)
                try {
                    const avgCpu = Math.round((data.nodes.reduce((s,n)=>s+(n.cpu_load||0),0) / Math.max(1,data.nodes.length)));
                    const avgRam = Math.round((data.nodes.reduce((s,n)=>s+(n.ram_load||0),0) / Math.max(1,data.nodes.length)));
                    const now = new Date().toLocaleTimeString();
                    setMetricsHistory(prev => {
                        const cpu = [...prev.cpu, avgCpu].slice(-60);
                        const ram = [...prev.ram, avgRam].slice(-60);
                        const ts = [...prev.ts, now].slice(-60);
                        return { cpu, ram, ts };
                    });
                } catch (e) {
                    // ignore
                }
            };

            useEffect(() => {
                if (!auth.authenticated) return undefined;
                fetchTopology();
                let fallbackTimer;
                let watchdogTimer;
                let socket;
                let receivedMessage = false;
                const startFallback = () => {
                    if (!fallbackTimer) {
                        setLiveStatus('polling fallback');
                        fallbackTimer = setInterval(fetchTopology, 2000);
                    }
                };
                try {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    socket = new WebSocket(`${protocol}//${window.location.host}/ws/telemetry`);
                    socket.onopen = () => setLiveStatus('live');
                    socket.onmessage = event => {
                        const data = JSON.parse(event.data);
                        receivedMessage = true;
                        setTopology(data);
                        if (data.ai_diagnostics) setAiDiagnostics(data.ai_diagnostics);
                        setLiveStatus('live');
                        const avgCpu = Math.round((data.nodes.reduce((sum, node) => sum + (node.cpu_load || 0), 0) / Math.max(1, data.nodes.length)));
                        const avgRam = Math.round((data.nodes.reduce((sum, node) => sum + (node.ram_load || 0), 0) / Math.max(1, data.nodes.length)));
                        setMetricsHistory(prev => ({
                            cpu: [...prev.cpu, avgCpu].slice(-60),
                            ram: [...prev.ram, avgRam].slice(-60),
                            ts: [...prev.ts, new Date().toLocaleTimeString()].slice(-60)
                        }));
                    };
                    socket.onerror = startFallback;
                    socket.onclose = startFallback;
                    watchdogTimer = setTimeout(() => { if (!receivedMessage) startFallback(); }, 4000);
                } catch (error) {
                    startFallback();
                }
                return () => {
                    clearInterval(fallbackTimer);
                    clearTimeout(watchdogTimer);
                    if (socket) socket.close();
                };
            }, [selectedNode?.id, auth.authenticated]);

            useEffect(() => {
                if (!isAiModalOpen || !auth.authenticated) return undefined;
                const timer = setInterval(fetchAiDiagnostics, 3000);
                return () => clearInterval(timer);
            }, [isAiModalOpen, auth.authenticated]);

            const login = async (username, password) => {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                let data;
                try {
                    data = await res.json();
                } catch (error) {
                    return { success: false, error: `Server returned an invalid response (${res.status}).` };
                }
                if (!res.ok || !data.success) {
                    return { success: false, error: data.error || `Login failed (${res.status}).` };
                }
                setAuth({ authenticated: true, token: data.token, username: data.username, role: data.role, permissions: data.permissions });
                return data;
            };

            // Template Switch
            const handleTemplateChange = async (e) => {
                const newTpl = e.target.value;
                setTemplate(newTpl);
                await fetch('/api/topology/template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ template: newTpl })
                });
                setSelectedNode(null);
                setSelectedLink(null);
                fetchTopology();
            };

            // Trigger Failure
            const triggerFailure = async (type, targetId, intensity = 1.0) => {
                await fetch('/api/simulate/failure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, target_id: targetId, intensity })
                });
                fetchTopology();
            };

            // Heal All
            const healAll = async () => {
                await fetch('/api/simulate/heal', { method: 'POST' });
                fetchTopology();
            };

            // Calculate Path
            const runPathFinder = async () => {
                if (!pathFinder.source || !pathFinder.target) return;
                const res = await fetch('/api/simulate/path', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source: pathFinder.source, target: pathFinder.target })
                });
                const data = await res.json();
                setPathFinder(prev => ({ ...prev, result: data }));
            };

            const runAutoReroute = async () => {
                if (!pathFinder.source || !pathFinder.target) return;
                const res = await fetch('/api/advanced/route-optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source: pathFinder.source, target: pathFinder.target })
                });
                const data = await res.json();
                setPathFinder(prev => ({ ...prev, result: data }));
            };

            // Run CLI command
            const handleCliSubmit = async (e) => {
                e.preventDefault();
                if (!cliInput.trim()) return;

                const cmd = cliInput.trim();
                const nodeContext = selectedNode ? selectedNode.id : (topology.nodes[0]?.id || 'r1');

                setCliHistory(prev => [...prev, { text: `${selectedNode ? selectedNode.name : 'Device'}# ${cmd}`, type: "command" }]);
                setCliInput('');

                try {
                    const res = await fetch('/api/cli/execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ node_id: nodeContext, command: cmd })
                    });
                    const data = await res.json();
                    setCliHistory(prev => [...prev, { text: data.output, type: "output" }]);
                    fetchTopology();
                } catch (err) {
                    setCliHistory(prev => [...prev, { text: "Error executing command", type: "error" }]);
                }
            };

            // Fetch AI Diagnostics
            const fetchAiDiagnostics = async () => {
                const [diagnostics, forecast, insights, drift, capacity] = await Promise.all([
                    fetch('/api/ai/diagnostics').then(res => res.json()),
                    fetch('/api/advanced/forecast').then(res => res.json()),
                    fetch('/api/insights').then(res => res.json()),
                    fetch('/api/config-drift').then(res => res.json()),
                    fetch('/api/capacity-plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ growth_percent: 25, horizon_months: 6 }) }).then(res => res.json())
                ]);
                setAiDiagnostics(diagnostics);
                setCopilotInsights({ forecast, insights, drift, capacity });
                setIsAiModalOpen(true);
            };

            const fetchNetworkInsights = async () => {
                const res = await fetch('/api/insights');
                const data = await res.json();
                setNetworkInsights(data);
            };

            const fetchAdvancedData = async () => {
                const [forecast, history, gns3, capacity, alert, drift, audit] = await Promise.all([
                    fetch('/api/advanced/forecast').then(res => res.json()),
                    fetch('/api/history?limit=12').then(res => res.json()),
                    fetch('/api/gns3/sync', { method: 'POST' }).then(res => res.json()),
                    fetch('/api/capacity-plan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ growth_percent: 25, horizon_months: 6 }) }).then(res => res.json()),
                    fetch('/api/alerts/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ channel: 'teams' }) }).then(res => res.json()),
                    fetch('/api/config-drift').then(res => res.json()),
                    fetch('/api/audit-log?limit=8').then(res => res.json())
                ]);
                setAdvancedData({ forecast, history, gns3, capacity, alert, drift, audit });
            };

            const sendEmailAlert = async () => {
                const response = await fetch('/api/alerts/email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                return response.json();
            };

            // Generate Config
            const generateCiscoConfig = async (nodeId) => {
                const res = await fetch('/api/export/cisco_config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ node_id: nodeId })
                });
                const data = await res.json();
                setGeneratedConfig(data.config);
                setIsConfigModalOpen(true);
            };

            // Export GNS3 / Packet Tracer
            const downloadExport = async (format) => {
                const res = await fetch(`/api/export/${format}`);
                const data = await res.json();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `network_digital_twin_${format}.${format === 'gns3' ? 'gns3' : 'json'}`;
                a.click();
            };

            // Toggle Twin Sync mode
            const toggleTwinMode = async (mode) => {
                setTwinMode(mode);
                await fetch('/api/twin/mode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode })
                });
                fetchTopology();
            };

            const summary = topology.summary || {};

            if (!auth.authenticated) {
                return <LoginPage onLogin={login} />;
            }

            return (
                <div className="flex flex-col h-screen w-screen bg-[#080c14] text-slate-100 overflow-hidden">
                    {/* Top Navigation Bar */}
                    <header className="h-16 px-6 glass-panel flex items-center justify-between z-30 border-b border-slate-800">
                            <div className="flex items-center space-x-4">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                                <i className="fa-solid fa-network-wired text-xl text-white"></i>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2">
                                    <h1 className="text-lg font-bold tracking-wide bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
                                        NETWORK DIGITAL TWIN
                                    </h1>
                                    <span className="px-2 py-0.5 text-xs font-semibold rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                                        v2.4 Enterprise
                                    </span>
                                </div>
                                <p className="text-xs text-slate-400">Virtual Topology Mirroring & What-If Failure Simulator</p>
                            </div>
                        </div>

                        {/* Top Status & Metrics Quickbar */}
                        <div className="flex items-center space-x-6">
                            {/* Health Score Indicator */}
                            <div className="flex items-center space-x-3 px-4 py-1.5 rounded-lg bg-slate-900/60 border border-slate-800">
                                <div className="text-right">
                                    <div className="text-xs text-slate-400">Health Score</div>
                                    <div className={`text-sm font-bold ${summary.health_score > 80 ? 'text-emerald-400' : summary.health_score > 50 ? 'text-amber-400' : 'text-red-400'}`}>

        function TopologyCanvas({ nodes, links, selectedNode, setSelectedNode, selectedLink, setSelectedLink, pathResult }) {
            const pathNodeSet = new Set(pathResult?.path_nodes || []);
            const pathLinkSet = new Set(pathResult?.path_links || []);

            const getNodeIcon = (type) => {
                switch (type) {
                    case 'router': return 'fa-solid fa-route text-cyan-400';
                    case 'switch': return 'fa-solid fa-network-wired text-blue-400';
                    case 'firewall': return 'fa-solid fa-shield-halved text-amber-400';
                    case 'server': return 'fa-solid fa-server text-purple-400';
                    case 'client': return 'fa-solid fa-desktop text-emerald-400';
                    case 'cloud': return 'fa-solid fa-cloud text-sky-400';
                    default: return 'fa-solid fa-cube text-slate-400';
                }
            };

            return (
                <svg className="w-full h-full select-none" viewBox="0 0 1000 650">
                    {/* Grid Background Pattern */}
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1" />
                        </pattern>
                        <linearGradient id="linkGradientNormal" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#00f2fe" stopOpacity="0.6"/>
                            <stop offset="100%" stopColor="#4facfe" stopOpacity="0.6"/>
                        </linearGradient>
                        <linearGradient id="linkGradientPath" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.9"/>
                            <stop offset="100%" stopColor="#fb7185" stopOpacity="0.9"/>
                        </linearGradient>
                    </defs>

                    <rect width="1000" height="650" fill="url(#grid)" />

                    {/* Render Links */}
                    <g>
                        {links.map(link => {
                            const sourceNode = nodes.find(n => n.id === link.source);
                            const targetNode = nodes.find(n => n.id === link.target);
                            if (!sourceNode || !targetNode) return null;

                            const isSelected = selectedLink?.id === link.id;
                            const isPath = pathLinkSet.has(link.id);
                            const isDown = link.status === 'down';
                            const isCongested = link.status === 'congested' || link.utilization > 80;

                            const strokeColor = isDown ? '#ef4444' : isPath ? '#f43f5e' : isCongested ? '#f59e0b' : '#0066ff';
                            const strokeWidth = isSelected ? 4 : isPath ? 3.5 : 2;

                            const midX = (sourceNode.x + targetNode.x) / 2;
                            const midY = (sourceNode.y + targetNode.y) / 2;

                            return (
                                <g key={link.id} onClick={() => setSelectedLink(link)} className="cursor-pointer">
                                    <line 
                                        x1={sourceNode.x} 
                                        y1={sourceNode.y} 
                                        x2={targetNode.x} 
                                        y2={targetNode.y}
                                        stroke={strokeColor}
                                        strokeWidth={strokeWidth}
                                        strokeDasharray={isDown ? '6,6' : 'none'}
                                        opacity={isDown ? 0.4 : 0.8}
                                    />

                                    {/* Link Telemetry Tag */}
                                    <g transform={`translate(${midX}, ${midY})`}>
                                        <rect 
                                            x="-50" y="-10" width="100" height="20" rx="6" 
                                            fill="#0f172a" 
                                            stroke={strokeColor}
                                            strokeWidth="1"
                                            opacity="0.9"
                                        />
                                        <text x="0" y="3" textAnchor="middle" fill="#94a3b8" fontSize="8" className="code-font font-medium">
                                            {isDown ? 'DOWN' : `${link.utilization}% | ${link.throughput} Mbps`}
                                        </text>
                                    </g>

                                    {/* Animated Traffic Packets on Active Links */}
                                    {!isDown && Array.from({ length: Math.max(1, Math.min(5, Math.ceil(link.utilization / 20))) }).map((_, packetIndex) => (
                                        <circle key={`${link.id}-packet-${packetIndex}`} r={isCongested ? 4 : 3.5} fill={isPath ? '#f43f5e' : isCongested ? '#fbbf24' : '#00f2fe'}>
                                            <animateMotion
                                                path={`M ${sourceNode.x} ${sourceNode.y} L ${targetNode.x} ${targetNode.y}`}
                                                begin={`${packetIndex * -0.35}s`}
                                                dur={`${Math.max(0.55, 3.2 - (link.utilization / 28.0))}s`}
                                                repeatCount="indefinite"
                                            />
                                        </circle>
                                    ))}
                                </g>
                            );
                        })}
                    </g>

                    {/* Render Nodes */}
                    <g>
                        {nodes.map(node => {
                            const isSelected = selectedNode?.id === node.id;
                            const isPath = pathNodeSet.has(node.id);
                            const isFailed = node.status === 'failed';
                            const isDegraded = node.status === 'degraded';

                            return (
                                <g 
                                    key={node.id} 
                                    transform={`translate(${node.x}, ${node.y})`}
                                    onClick={() => setSelectedNode(node)}
                                    className="cursor-pointer"
                                >
                                    {/* Node Outer Glow / Status Ring */}

                </div>
            );
        }

        // Telemetry Tab Component (renders charts for CPU/RAM using Chart.js)
        function TelemetryTab({ summary, nodes, links, metricsHistory }) {
            const cpuCanvasRef = useRef(null);
            const ramCanvasRef = useRef(null);
            const cpuChartRef = useRef(null);
            const ramChartRef = useRef(null);

            useEffect(() => {
                if (cpuCanvasRef.current && !cpuChartRef.current) {
                    cpuChartRef.current = new Chart(cpuCanvasRef.current.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels: metricsHistory.ts || [],
                            datasets: [{ label: 'Avg CPU %', data: metricsHistory.cpu || [], borderColor: '#06b6d4', backgroundColor: 'rgba(6,182,212,0.08)', fill: true, tension: 0.3 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                    });
                }

                if (ramCanvasRef.current && !ramChartRef.current) {
                    ramChartRef.current = new Chart(ramCanvasRef.current.getContext('2d'), {
                        type: 'line',
                        data: {
                            labels: metricsHistory.ts || [],
                            datasets: [{ label: 'Avg RAM %', data: metricsHistory.ram || [], borderColor: '#a78bfa', backgroundColor: 'rgba(167,139,250,0.08)', fill: true, tension: 0.3 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                    });
                }

                // update charts when metricsHistory changes
                if (cpuChartRef.current) {
                    cpuChartRef.current.data.labels = metricsHistory.ts || [];
                    cpuChartRef.current.data.datasets[0].data = metricsHistory.cpu || [];
                    cpuChartRef.current.update('none');
                }

                if (ramChartRef.current) {
                    ramChartRef.current.data.labels = metricsHistory.ts || [];
                    ramChartRef.current.data.datasets[0].data = metricsHistory.ram || [];
                    ramChartRef.current.update('none');
                }

                return () => {
                    // cleanup on unmount
                    // keep charts for reuse during session, but if unmounting destroy
                    // (React dev may remount frequently)
                    // destroy only if refs exist
                    // (avoid destroying on every update)
                };
            }, [metricsHistory]);

            return (
                <div className="space-y-4 text-xs">
                    <div className="p-4 glass-card rounded-xl border border-slate-800 space-y-3">
                        <h3 className="font-bold text-sm text-slate-100 flex items-center space-x-2">
                            <i className="fa-solid fa-chart-line text-cyan-400"></i>
                            <span>Live SNMP Metrics</span>
                        </h3>

                        <div className="grid grid-cols-2 gap-3">
                            <div className="p-3 bg-slate-900/60 rounded-lg h-44">
                                <div className="text-slate-400 text-[10px] mb-2">Avg CPU (last samples)</div>
                                <div className="h-32">
                                    <canvas ref={cpuCanvasRef} />
                                </div>
                            </div>

                            <div className="p-3 bg-slate-900/60 rounded-lg h-44">
                                <div className="text-slate-400 text-[10px] mb-2">Avg RAM (last samples)</div>
                                <div className="h-32">
                                    <canvas ref={ramCanvasRef} />
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2 mt-3 text-center">
                            <div className="p-3 bg-slate-900/60 rounded-lg">
                                <div className="text-slate-400 text-[10px]">Avg Latency</div>
                                <div className="text-base font-bold text-cyan-400">{summary.avg_latency ?? 0} ms</div>
                            </div>
                            <div className="p-3 bg-slate-900/60 rounded-lg">
                                <div className="text-slate-400 text-[10px]">Total Throughput</div>
                                <div className="text-base font-bold text-purple-400">{summary.total_throughput_gbps ?? 0} Gbps</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Digital Twin Sync Tab Component
        function TwinSyncTab({ twinMode, toggleTwinMode, summary, incidents }) {
            return (
                <div className="space-y-4 text-xs">
                    <div className="p-4 glass-card rounded-xl border border-slate-800 space-y-3">
                        <h3 className="font-bold text-sm text-slate-100">Digital Twin Alignment</h3>
                        <p className="text-slate-400 text-[11px]">Compare physical network telemetry against the virtual digital twin model.</p>
                        
                        <div className="space-y-2">
                            <button 
                                onClick={() => toggleTwinMode('LIVE_SYNC')}
                                className={`w-full p-3 rounded-lg border text-left flex justify-between items-center ${twinMode === 'LIVE_SYNC' ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-400'}`}
                            >
                                <div>
                                    <div className="font-bold">LIVE TELEMETRY MIRROR</div>
                                    <div className="text-[10px] opacity-80">Real-time sync with network telemetry</div>
                                </div>
                                {twinMode === 'LIVE_SYNC' && <i className="fa-solid fa-check"></i>}
                            </button>

                            <button 
                                onClick={() => toggleTwinMode('ISOLATED_SANDBOX')}
                                className={`w-full p-3 rounded-lg border text-left flex justify-between items-center ${twinMode === 'ISOLATED_SANDBOX' ? 'bg-purple-500/20 border-purple-500/40 text-purple-300' : 'bg-slate-900 border-slate-800 text-slate-400'}`}
                            >
                                <div>
                                    <div className="font-bold">ISOLATED SANDBOX MODE</div>
                                    <div className="text-[10px] opacity-80">Test high-risk changes safely offline</div>
                                </div>
                                {twinMode === 'ISOLATED_SANDBOX' && <i className="fa-solid fa-check"></i>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
